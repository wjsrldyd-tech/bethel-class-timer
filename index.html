<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>벧엘 타이머</title>
  <!-- 7-segment 스타일 : DSEG7 Classic (400 + 700 볼드) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dseg7-classic@5.2.5/index.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dseg7-classic@5.2.5/700.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="logo">벧엘수학</h1>
      <div class="header__end">
        <div class="count-toggle" role="group" aria-label="표시할 타이머 개수">
          <span class="count-label">타이머</span>
          <button type="button" class="count-btn" data-count="1" aria-pressed="true">1</button>
          <button type="button" class="count-btn" data-count="2" aria-pressed="false">2</button>
          <button type="button" class="count-btn" data-count="3" aria-pressed="false">3</button>
        </div>
        <div class="header__tools">
          <button type="button" id="btn-presets" class="icon-btn icon-btn--tool" aria-label="프리셋 선택" title="프리셋 선택">
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
              <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5v-11Zm2.5-.5a.5.5 0 0 0-.5.5v11c0 .28.22.5.5.5h11a.5.5 0 0 0 .5-.5v-11a.5.5 0 0 0-.5-.5h-11ZM8 8h8v2H8V8Zm0 4h8v2H8v-2Zm0 4h5v2H8v-2Z"/>
            </svg>
          </button>
          <button type="button" id="btn-settings" class="icon-btn icon-btn--tool" aria-label="프리셋 설정" title="프리셋 설정">
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
              <path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.74 8.87c-.14.25-.08.57.12.64l2.03 1.58c-.05.31-.08.63-.08.94s.02.63.07.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.25.42.36.6.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.27.42.49.42h3.84c.24 0 .44-.18.49-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.14.48.03.6-.22l1.92-3.32c.14-.25.08-.57-.12-.64l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 15.6 12 3.6 3.6 0 0 1 12 15.6z"/>
            </svg>
          </button>
          <button type="button" id="btn-fullscreen" class="icon-btn icon-btn--tool" aria-pressed="false" aria-label="전체 화면" title="전체 화면">
            <svg class="icon-fs-enter" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
            </svg>
            <svg class="icon-fs-exit" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" hidden>
              <path fill="currentColor" d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="timer-grid count-1" id="timer-grid">
      <article class="timer-card" data-index="0">
        <div class="timer-title" data-placeholder="고등 모의 시험" aria-label="타이머 1 제목"></div>
        <div class="timer-display" aria-live="polite">00:00</div>
        <div class="timer-actions">
          <button type="button" class="btn btn-edit" data-action="edit">타이머 수정</button>
          <button type="button" class="btn btn-reset" data-action="reset">재설정</button>
          <button type="button" class="btn btn-toggle" data-action="toggle">시작</button>
        </div>
      </article>
      <article class="timer-card timer-card--slot2" data-index="1">
        <div class="timer-title" data-placeholder="고등 모의 시험" aria-label="타이머 2 제목"></div>
        <div class="timer-display" aria-live="polite">00:00</div>
        <div class="timer-actions">
          <button type="button" class="btn btn-edit" data-action="edit">타이머 수정</button>
          <button type="button" class="btn btn-reset" data-action="reset">재설정</button>
          <button type="button" class="btn btn-toggle" data-action="toggle">시작</button>
        </div>
      </article>
      <article class="timer-card timer-card--slot3" data-index="2">
        <div class="timer-title" data-placeholder="고등 모의 시험" aria-label="타이머 3 제목"></div>
        <div class="timer-display" aria-live="polite">00:00</div>
        <div class="timer-actions">
          <button type="button" class="btn btn-edit" data-action="edit">타이머 수정</button>
          <button type="button" class="btn btn-reset" data-action="reset">재설정</button>
          <button type="button" class="btn btn-toggle" data-action="toggle">시작</button>
        </div>
      </article>
    </main>

    <!-- 하단 배너·안내 문구 넣을 자리 (전체화면 시 높이 확보됨) -->
    <footer class="site-footer" role="region" aria-label="하단 안내"></footer>
  
    <div id="settings-modal" class="modal" hidden>
      <div class="modal__backdrop" data-close-settings></div>
      <div class="modal__panel modal__panel--settings" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
        <h2 id="settings-modal-title" class="modal__title">타이머 프리셋</h2>
        <p class="modal__hint">이름과 시간을 저장해 두었다가 타이머에 한 번에 적용할 수 있습니다. (이 브라우저에만 저장)</p>
      <div class="preset-apply-bar">
        <label class="preset-apply-label">
          타이머 제목 변경
          <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
            <select id="timer-title-target" class="preset-select" aria-label="제목 변경 타이머 선택">
              <option value="0">타이머 1</option>
              <option value="1">타이머 2</option>
              <option value="2">타이머 3</option>
            </select>
            <input type="text" id="timer-title-input" maxlength="40" placeholder="예: 고등 모의 시험" aria-label="타이머 제목 입력" />
            <button type="button" class="btn btn-modal-save" id="timer-title-save-btn">적용</button>
          </div>
        </label>
      </div>
        <div class="preset-apply-bar">
          <label class="preset-apply-label">
            적용할 타이머
            <select id="preset-apply-target" class="preset-select">
              <option value="0">타이머 1</option>
              <option value="1">타이머 2</option>
              <option value="2">타이머 3</option>
            </select>
          </label>
        </div>
        <ul id="preset-list" class="preset-list"></ul>
        <div class="preset-add">
          <h3 class="preset-add__title">프리셋 추가</h3>
          <div class="preset-add__row">
            <label class="modal__field modal__field--grow">
              이름
              <input type="text" id="preset-new-title" maxlength="40" placeholder="예: 고등 모의 시험" />
            </label>
          </div>
          <div class="modal__fields">
            <label class="modal__field">
              분
              <input type="number" id="preset-new-min" min="0" max="599" value="50" />
            </label>
            <label class="modal__field">
              초
              <input type="number" id="preset-new-sec" min="0" max="59" value="0" />
            </label>
          </div>
          <div class="modal__actions modal__actions--start">
            <button type="button" class="btn btn-modal-save" id="preset-add-btn">추가</button>
          </div>
        </div>
        <div class="modal__actions">
          <button type="button" class="btn btn-modal-cancel" id="settings-close-btn">닫기</button>
        </div>
      </div>
    </div>
  
    <div id="preset-picker-modal" class="modal" hidden>
      <div class="modal__backdrop" data-close-preset-picker></div>
      <div class="modal__panel modal__panel--settings" role="dialog" aria-modal="true" aria-labelledby="preset-picker-title">
        <h2 id="preset-picker-title" class="modal__title">프리셋 선택</h2>
        <div class="preset-apply-bar">
          <label class="preset-apply-label">
            적용할 타이머
            <select id="preset-picker-target" class="preset-select">
              <option value="0">타이머 1</option>
              <option value="1">타이머 2</option>
              <option value="2">타이머 3</option>
            </select>
          </label>
        </div>
        <ul id="preset-picker-list" class="preset-list"></ul>
        <div class="modal__actions">
          <button type="button" class="btn btn-modal-cancel" id="preset-picker-close-btn">닫기</button>
          <button type="button" class="btn btn-modal-save" id="preset-picker-manage-btn">프리셋 관리</button>
        </div>
      </div>
    </div>
  
    <div id="edit-modal" class="modal" hidden>
      <div class="modal__backdrop" data-close-modal></div>
      <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
        <h2 id="edit-modal-title" class="modal__title">목표 시간</h2>
        <div class="modal__fields">
          <label class="modal__field">
            분
            <input type="number" id="edit-min" min="0" max="599" value="10" />
          </label>
          <label class="modal__field">
            초
            <input type="number" id="edit-sec" min="0" max="59" value="0" />
          </label>
        </div>
        <div class="modal__actions">
          <button type="button" class="btn btn-modal-cancel" id="edit-cancel">취소</button>
          <button type="button" class="btn btn-modal-save" id="edit-save">적용</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
